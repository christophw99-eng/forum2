<style>
  :root {
    color-scheme: light;
    --stone: #ECE4D3;      /* Travertin, Tafelgrund */
    --stone-2: #DDD2BC;
    --ink: #2B241D;        /* Tinte */

  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: #1b1712; color: var(--ink);
    font-family: var(--text); -webkit-user-select: none; user-select: none;

  /* ---------- Ziel-Leiste oben ---------- */

    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; pointer-events: none;

  #auftrag {
    background: var(--shade); color: #F3EBDA; padding: 8px 14px 9px; border-left: 3px solid var(--minium);

  #punkte { background: var(--shade); color: #F3EBDA; padding: 8px 12px; font-family: var(--display); font-size: 15px; letter-spacing: .06em; white-space: nowrap; }

  /* ---------- Aktionsknopf ---------- */
  #aktion {
    position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: .08em;
    background: var(--stone); color: var(--ink); border: 2px solid var(--bronze); border-radius: 999px;
    padding: 16px 26px; box-shadow: 0 6px 18px rgba(0,0,0,.35); cursor: pointer;
  }

  /* ---------- Joystick ---------- */
  #stick { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(243,235,218,.55); background: rgba(24,19,14,.25); pointer-events: none; }

  #hinweis-steuerung { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); color: #F3EBDA; font-family: var(--ui); font-size: 12px; opacity: .8; text-shadow: 0 1px 3px #000; pointer-events: none; }

    background: var(--stone); background-image: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 40%);
    border-top: 5px solid var(--minium); box-shadow: 0 14px 40px rgba(0,0,0,.5);
    padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 12px;
  }

  #tafel .lat { font-size: clamp(21px, 3.1vw, 27px); line-height: 1.35; color: var(--ink); }

  #tafel .de { font-size: 18px; line-height: 1.45; color: var(--ink-soft); max-width: 62ch; }
  #tafel .vok { font-size: 15px; font-style: italic; color: var(--ink-soft); border-top: 1px solid #D4C7AC; padding-top: 8px; }
  #tafel .frage { font-size: 19px; font-weight: 600; line-height: 1.35; }
  .optionen { display: grid; gap: 8px; }
  .optionen button, .woerter button, .knopfzeile button {
    font-family: var(--text); font-size: 18px; text-align: left; color: var(--ink);
    background: #F7F1E4; border: 1.5px solid #C6B690; border-radius: 6px; padding: 11px 14px; cursor: pointer;

  .optionen button.falsch { border-color: var(--minium); background: #F4E1DA; }
  .optionen button.richtig { border-color: var(--verdigris); background: #DDEBE3; }
  .woerter { display: flex; flex-wrap: wrap; gap: 8px; }

  .woerter button.weg { visibility: hidden; }
  .satz { min-height: 52px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px; border: 1.5px dashed #B9A87F; border-radius: 6px; background: #F7F1E4; }
  .satz:empty::before { content: 'Tippe die Wörter in der richtigen Reihenfolge an …'; color: #9C8E74; font-style: italic; font-size: 16px; }
  .satz button { font-family: var(--text); font-size: 21px; background: var(--ink); color: var(--stone); border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }

  .rueck.ok { border-color: var(--verdigris); background: #E3EEE7; }

  .knopfzeile button { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .08em; background: var(--ink); color: var(--stone); border-color: var(--ink); padding: 11px 20px; text-align: center; }
  .knopfzeile button.leise { background: transparent; color: var(--ink); border-color: #C6B690; }
  button:focus-visible { outline: 3px solid var(--bronze); outline-offset: 2px; }

  /* ---------- Titel / Laden ---------- */
  #titel {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
    background: radial-gradient(ellipse at 50% 30%, rgba(40,32,24,.35), rgba(20,16,12,.88));

  #titel .blatt { width: min(620px, 100%); background: var(--stone); padding: 28px 28px 24px; border-top: 6px solid var(--minium); box-shadow: 0 20px 60px rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 14px; }
  #titel .ueber { font-family: var(--ui); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--bronze); }
  #titel h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 7vw, 54px); letter-spacing: .06em; margin: 0; line-height: 1.05; text-wrap: balance; }
  #titel p { margin: 0; font-size: 19px; line-height: 1.45; color: var(--ink-soft); }
  #titel .steuer { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 16px; color: var(--ink); background: var(--stone-2); padding: 12px 14px; }
  #titel .steuer b { font-family: var(--ui); font-size: 12px; letter-spacing: .06em; padding-top: 3px; }
  #laden { height: 4px; background: var(--stone-2); }
  #laden i { display: block; height: 100%; width: 0; background: var(--minium); transition: width .2s; }
  #los { align-self: flex-start; font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: .1em; background: var(--ink); color: var(--stone); border: 0; padding: 14px 28px; cursor: pointer; }
  #los:disabled { opacity: .45; cursor: wait; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

    <h1>Quis fēcit?</h1>
    <p>Montag, dritte Stunde, Latein bei Herrn Wendland. Heute steht das Passiv in allen Zeiten an – Präsens, Imperfekt, Futur. Die Übungen liegen schon auf den Tischen. Und irgendetwas stimmt heute nicht mit der Tafel …</p>

<script>
/* Geschichte im Klassenraum mit gespielten Szenen: Gliederpuppen, Kameraschwenk, Tafel, Loch, Sprung nach Rom */
(function () {
  const KX = 1000, FORUM_B = [-24.3, 24.3, -68, 90], KLASSE_B = [KX - 4.35, KX + 4.35, -3.45, 3.35];
  window.__B = KLASSE_B;
  const S = { mode: 'klasse', cried: 0, spawn: 0, loch: 0, trans: 0, last: null, focus: null, t: 0, jobs: [] };
  window.__S = S;
  const bereit = () => window.__G && document.querySelector('#los') && !document.querySelector('#los').disabled;
  const iv = setInterval(() => { if (bereit()) { clearInterval(iv); try { init(); } catch (e) { console.error(e); } } }, 150);
  const meshes = o => { const a = []; o && o.traverse(c => { if (c.isMesh) a.push(c); }); return a; };
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = k => k < 0 ? 0 : k > 1 ? 1 : k * k * (3 - 2 * k);
  const winkel = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };
  const blick = (dx, dz) => Math.atan2(-dx, -dz);

  // ---------- Puppen ----------
  const GL = ['Rumpf', 'Kopf', 'OA_L', 'OA_R', 'UA_L', 'UA_R', 'OS_L', 'OS_R', 'US_L', 'US_R'];
  function puppe(name) {
    const sc = window.__G.scene, root = sc.getObjectByName(name);
    if (!root) return null;
    // Blickrichtung sauber als reine Drehung um y (glTF liefert teils Euler (π, y, π))
    { const d = root.getWorldDirection(root.position.clone()); root.rotation.set(0, Math.atan2(d.x, d.z), 0); }
    const p = { name, root, j: {}, ziel: {}, yawZiel: root.rotation.y, posZiel: null, tempo: 1, idle: null };
    for (const g of GL) { const o = sc.getObjectByName(name + '_' + g); if (o) { p.j[g] = o; p.ziel[g] = { x: o.rotation.x, y: o.rotation.y, z: o.rotation.z }; } }
    p.hueft = root.position.y;
    try { p.stand = root.position.y - new S.Box().setFromObject(root).min.y; } catch (e) { p.stand = 0.92; }
    return p;
  }
  function pose(p, werte, tempo) {
    if (!p) return;
    if ('OA_L' in werte || 'UA_L' in werte) { const v = x => typeof x === 'number' ? x : (x && x.x) || 0; p.halten = v(werte.OA_L) < 0.2 && v(werte.UA_L) < 0.2; }
    for (const [g, w] of Object.entries(werte)) {
      if (!p.ziel[g]) continue;
      Object.assign(p.ziel[g], typeof w === 'number' ? { x: w } : w);
    }
    if (tempo) p.tempo = tempo;
  }
  function puppeTick(p, dt, t) {
    if (!p) return;
    const k = 1 - Math.exp(-dt * 6 * p.tempo);
    for (const g in p.j) {
      const o = p.j[g], z = p.ziel[g];
      o.rotation.x = lerp(o.rotation.x, z.x, k); o.rotation.y = lerp(o.rotation.y, z.y, k); o.rotation.z = lerp(o.rotation.z, z.z, k);
    }
    p.root.rotation.y += winkel(p.root.rotation.y, p.yawZiel) * (1 - Math.exp(-dt * 4));
    if (p.idle) p.idle(p, t);
  }
  const SITZ = { OS_L: Math.PI / 2, OS_R: Math.PI / 2, US_L: -Math.PI / 2, US_R: -Math.PI / 2 };
  const STEH = { OS_L: 0, OS_R: 0, US_L: 0, US_R: 0 };
  const RUHE = { Rumpf: { x: 0, y: 0, z: 0 }, Kopf: { x: 0, y: 0, z: 0 } };

  // Ablaeufe (nacheinander abgespielte Schritte)
  function ablauf(schritte) { S.jobs.push({ s: schritte, i: 0, t0: null }); }
  function jobsTick(t) {
    for (const j of S.jobs) {
      while (j.i < j.s.length) {
        const st = j.s[j.i];
        if (j.t0 === null) { j.t0 = t; st.start && st.start(); }
        const k = st.dauer ? Math.min(1, (t - j.t0) / st.dauer) : 1;
        st.lauf && st.lauf(k, t);
        if (k < 1) break;
        st.ende && st.ende(); j.i++; j.t0 = null;
      }
    }
    S.jobs = S.jobs.filter(j => j.i < j.s.length);
  }
  function gehen(p, punkte, tempo = 1.1, hoehe = null) {
    const schritte = [];
    let von = null;
    punkte.forEach(([x, z]) => {
      let a, b, dist;
      schritte.push({
        start() { a = { x: p.root.position.x, z: p.root.position.z }; b = { x: KX + x, z }; dist = Math.hypot(b.x - a.x, b.z - a.z); this.dauer = Math.max(0.3, dist / tempo); p.yawZiel = blick(b.x - a.x, b.z - a.z); },
        dauer: 1,
        lauf(k, t) {
          p.root.position.x = lerp(a.x, b.x, k); p.root.position.z = lerp(a.z, b.z, k);
          const s = Math.sin(t * 7);
          pose(p, { OS_L: s * 0.45, OS_R: -s * 0.45, US_L: Math.max(0, -s) * 0.5, US_R: Math.max(0, s) * 0.5, OA_L: -s * 0.3, OA_R: s * 0.3 }, 3);
          p.root.position.y = (hoehe ? p.basis + hoehe(p.root.position.x, p.root.position.z) : p.hueft) + Math.abs(Math.cos(t * 7)) * 0.03;
        },
        ende() { pose(p, { OS_L: 0, OS_R: 0, US_L: 0, US_R: 0, OA_L: 0, OA_R: 0 }); p.root.position.y = hoehe ? p.basis + hoehe(p.root.position.x, p.root.position.z) : p.hueft; }
      });
    });
    return schritte;
  }

  let bc, bx, btex, sx2, stex, W, SCH = {}, KAM, KKOPF; const FP = {};
  function init() {
    const G = window.__G, sc = G.scene, get = n => sc.getObjectByName(n);
    S.Box = G.Zs.lapis.constructor;
    S.raum = get('K_Raum'); S.root = S.raum.parent;
    S.board = get('K_Tafel_Bild'); S.lochO = get('K_Loch');
    KAM = get('K_Kamel'); KKOPF = get('K_Kamel_Kopf'); S.bob = get('K_Bobibu');
    S.tears = [0, 1, 2, 3, 4, 5].map(i => get('K_Traene_' + i)).filter(Boolean);
    S.story = new Set([S.lochO, KAM, S.bob, ...S.tears].filter(Boolean));
    S.Z = { helfer: G.Zs.helfer, tafel: G.Zs.tafel };
    delete G.Zs.helfer; delete G.Zs.tafel;
    S.kT = KAM.position.clone(); S.kYaw = KAM.rotation.y; S.bT = S.bob.position.clone();
    sc.traverse(o => { if (o.isSkinnedMesh) o.frustumCulled = false; });
    W = puppe('K_Wendland');
    for (const n of ['Hannah', 'Jona', 'Lena', 'Emilio', 'Moritz', 'Oskar']) {
      SCH[n] = puppe('K_' + n);
      const ph = Math.random() * 6;
      SCH[n].idle = (p, t) => { if (!p.fest) { p.j.Kopf.rotation.y += (Math.sin(t * 0.4 + ph) * 0.35 - p.j.Kopf.rotation.y) * 0.02; } };
    }
    // Forum-Puppen
    FP.TIB = puppe('Tiberius'); FP.OCT = puppe('F_Octavius'); FP.OPT = puppe('F_Optimat'); FP.GAI = puppe('F_Gaius');
    FP.BOTE = puppe('F_Bote'); FP.HER = puppe('F_Herold'); FP.NAS = puppe('F_Nasica');
    FP.BUE = [0, 1, 2, 3, 4, 5, 6, 7].map(i => puppe('F_Buerger_' + i)).filter(Boolean);
    FP.SEN = [0, 1, 2, 3, 4, 5].map(i => puppe('F_Senator_' + i)).filter(Boolean);
    FP.alle = [FP.TIB, FP.OCT, FP.OPT, FP.GAI, FP.BOTE, FP.HER, FP.NAS, ...FP.BUE, ...FP.SEN].filter(Boolean);
    FP.versteckt = [FP.OCT, FP.OPT, FP.GAI, FP.BOTE, FP.HER, FP.NAS, ...FP.SEN].filter(Boolean);
    FP.versteckt.forEach(p => S.story.add(p.root));
    FP.bob = get('Bobibu');
    // Herr Wendland erklaert an der Tafel
    W.idle = (p, t) => {
      if (S.wModus === 'erklaeren') { p.ziel.OA_R.x = 1.3 + Math.sin(t * 1.3) * 0.35; p.ziel.UA_R.x = 0.6 + Math.sin(t * 1.7) * 0.3; p.ziel.Kopf.y = Math.sin(t * 0.5) * 0.3; }
      // Tablet in der linken Hand halten, solange der linke Arm nicht anders gebraucht wird
      if (p.halten !== false && !S.weint) { p.ziel.OA_L.x = 0.28 + Math.sin(t * 0.8) * 0.04; p.ziel.UA_L.x = 1.3 + Math.sin(t * 1.1) * 0.08; }
    };
    S.wModus = 'erklaeren';
    // Tafelbild
    const bm = meshes(S.board)[0], m0 = bm.material, Tex = m0.map.constructor;
    bc = document.createElement('canvas'); bc.width = 1024; bc.height = 640; bx = bc.getContext('2d');
    btex = new Tex(bc); btex.flipY = false; btex.colorSpace = m0.map.colorSpace; btex.anisotropy = 4;
    const bmat = m0.clone(); bmat.map = btex; bmat.emissiveMap = btex; bmat.emissive.setRGB(1, 1, 1); bmat.emissiveIntensity = 0.6; bmat.lightMap = null;
    bm.material = bmat;
    const lm = meshes(S.lochO)[0];
    const sc2 = document.createElement('canvas'); sc2.width = sc2.height = 256; sx2 = sc2.getContext('2d');
    stex = new Tex(sc2); stex.flipY = false; stex.colorSpace = m0.map.colorSpace;
    const lmat = lm.material.clone(); lmat.map = null; lmat.color.setRGB(0, 0, 0); lmat.emissive.setRGB(1, 1, 1); lmat.emissiveMap = stex; lmat.emissiveIntensity = 1.3; lmat.lightMap = null;
    lm.material = lmat;
    modus('klasse');
    tafel('start');
    window.__zeile = zeile;
    window.__tick = tick;
  }

  function modus(m) {

erson Singular (ich) bis zur 3. Person Plural (sie)."},{"order":"Präsens Passiv: Bring die Endungen in die richtige Reihenfolge.","tiles":["-ntur","-ris","-or","-minī","-tur","-mur"],"right":["-or","-ris","-tur","-mur","-minī","-ntur"],"ok":"Richtig: -or, -ris, -tur, -mur, -minī, -ntur. Fast überall hängt das Passiv ein -r an.","no":"Fang mit der 1. Person Singular an: -or („ich werde …“)."},{"order":"Imperfekt Passiv von vocāre: Bring die Formen in die richtige Reihenfolge.","tiles":["vocābātur","vocābar","vocābantur","vocābāmur","vocābāris","vocābāminī"],"right":["vocābar","vocābāris","vocābātur","vocābāmur","vocābāminī","vocābantur"],"ok":"Richtig. Das Imperfekt erkennst du am -bā-, das Passiv an den Endungen: vocā-bā-r.","no":"Achte auf die Endungen: -r (ich), -ris (du), -tur (er/sie/es) …"}],"tisch2":[{"say":"Arbeitsblatt · Übung 2","de":"Zuordnen: Tippe links eine Form an und dann rechts die passende Lösung."},{"match":"Welche Zeit? Ordne jeder Form ihre Bestimmung zu.","pairs":[["vocor","1. Sg. Präsens Passiv"],["vocābar","1. Sg. Imperfekt Passiv"],["vocābor","1. Sg. Futur Passiv"],["monentur","3. Pl. Präsens Passiv"],["monēbantur","3. Pl. Imperfekt Passiv"],["monēbuntur","3. Pl. Futur Passiv"]],"ok":"Alles richtig zugeordnet. -bā- = Imperfekt, -b- mit -o-, -i- oder -u- = Futur.","no":"Passt nicht. Schau auf das Tempuszeichen: -bā- ist Imperfekt, -bo-/-bi-/-bu- ist Futur."},{"match":"Ordne jeder Form die deutsche Übersetzung zu.","pairs":[["monētur","er wird ermahnt"],["monēbātur","er wurde ermahnt"],["monēbitur","er wird ermahnt werden"],["monēbit","er wird ermahnen"]],"ok":"Richtig. Vorsicht Falle: monēbit (Futur Aktiv) hat auch ein „wird“ – aber kein Passiv.","no":"Noch nicht. Zähle die „werden“ und schau, ob ein „ermahnt“ dabeisteht."}],"tisch3":[{"say":"Arbeitsblatt · Übung 3","de":"Das Futur Passiv. Bei der a- und e-Konjugation hilft das -b-, bei der konsonantischen Konjugation das -a- bzw. -ē-."},{"order":"Futur Passiv von laudāre: Bring die Formen in die richtige Reihenfolge.","tiles":["laudābitur","laudābuntur","laudābor","laudābiminī","laudāberis","laudābimur"],"right":["laudābor","laudāberis","laudābitur","laudābimur","laudābiminī","laudābuntur"],"ok":"Richtig. Merke dir die zwei Ausreißer: laudāberis (mit -e-) und laudābuntur (mit -u-).","no":"Beginne mit laudābor (ich). Die 2. Person Singular hat ein -e-: laudāberis."},{"match":"Konsonantische Konjugation: Präsens oder Futur?","pairs":[["pellor","ich werde vertrieben"],["pellar","ich werde vertrieben werden"],["pellitur","er wird vertrieben"],["pellētur","er wird vertrieben werden"]],"ok":"Genau. Das Futur der konsonantischen Konjugation hat -a- (1. Sg.) und sonst -ē-: pellar, pellētur.","no":"Schau auf den Vokal vor der Endung: -i- ist Präsens (pellitur), -ē- ist Futur (pellētur)."}],"wendland":[{"say":"Herr Wendland","de":"So, alle mal herhören! Stifte weg, Blick nach vorn. Ich habe mir eure Blätter angesehen. Präsens und Imperfekt klappen. Aber beim Futur Passiv geht alles durcheinander."},{"say":"Herr Wendland","lat":"vocābor","de":"Also, ganz langsam. Was heißt vocābor? Hannah?"},{"say":"Hannah","de":"„Ich werde rufen“?"},{"say":"Herr Wendland","de":"Nein! Das wäre vocābō – Futur Aktiv. Jona?"},{"say":"Jona","de":"„Ich werde gerufen!“"},{"say":"Herr Wendland","de":"Fast. Aber das ist vocor, Präsens! Da fehlt noch ein „werden“! Lena?"},{"say":"Lena","de":"„Ich werde … werden … gerufen … werden“? Das sind doch viel zu viele „werden“!"},{"say":"Emilio","de":"Und warum heißt das überhaupt „werden“, wenn gar nichts wird?"},{"say":"Herr Wendland","de":"ICH – WERDE – GERUFEN – WERDEN. Futur Passiv. -bor! Das erkläre ich jetzt zum vierzehnten Mal!"},{"say":"","de":"Stille. Irgendwo tickt die Uhr."},{"say":"Herr Wendland","de":"Ich … ich weiß nicht mehr weiter."},{"say":"Herr Wendland","de":"*Schnief* … *Schluchz* …"}],"helfer":[{"say":"Bobibu","de":"Buuuh! … Äh, ich meine: Salvē! Keine Angst, ich bin’s, Bobibu, das Gespenst. Und das hier ist das Kameeeeel."},{"say":"Kameeeeel","de":"Kameeeeel. Mit fünf Höckern. In jedem steckt eine Zeitform. Na ja – in dreien. Die anderen zwei sind für Proviant."},{"say":"Bobibu","de":"Euer Lehrer ist fix und fertig. Also übernehmen wir. Das Problem ist das deutsche Wort „werden“. Es hat nämlich zwei Jobs."},{"say":"Bobibu","de":"Job 1 – Futur: „ich werde rufen“ = vocābō. Job 2 – Passiv: „ich werde gerufen“ = vocor. Beide Jobs zusammen: „ich werde gerufen werden“ = vocābor."},{"say":"Kameeeeel","lat":"vocā-b-o-r","de":"Und im Lateinischen gibt es gar kein „werden“. Da erledigt das die Endung: das -b- sagt Futur, das -r sagt Passiv. vocābor hat beides."},{"choice":"Wie heißt „ich werde gerufen“?","opts":[["vocor",true,"Richtig. Ein „werden“ plus „gerufen“ – das ist Präsens Passiv."],["vocābō",false,"Das heißt „ich werde rufen“, Futur Aktiv. Da fehlt das „gerufen“."],["vocābor",false,"Das wäre „ich werde gerufen werden“ – zwei „werden“."],["vocābar",false,"Das ist Imperfekt: „ich wurde gerufen“."]]},{"choice":"Und was heißt vocābō?","lat":"vocābō","opts":[["ich werde rufen",true,"Genau. -bō ohne -r: Futur, aber Aktiv."],["ich werde gerufen",false,"Dafür bräuchte es die Passivendung -r: vocor."],["ich werde gerufen werden",false,"Das wäre vocābor – mit -r am Ende."],["ich rief",false,"Das wäre Perfekt: vocāvī."]]},{"say":"Bobibu","de":"Mein Werden-Detektor: Steht ein „gerufen“, „gelobt“, „vertrieben“ dabei? Dann arbeitet ein „werden“ fürs Passiv. Steht am Ende NOCH ein „werden“? Dann kommt das Futur dazu."},{"choice":"Das Kameeeeel behauptet: „Ganz einfach! Wo ‚werden‘ steht, ist es immer Futur.“ Stimmt das?","opts":[["Stimmt nicht.",true,"Richtig. In „ich werde gerufen“ steht „werden“ – und es ist Präsens Passiv (vocor)."],["Stimmt.",false,"Leider nein. „Ich werde gerufen“ ist Präsens Passiv, obwohl „werden“ drinsteht."]]},{"match":"Ordne die Formen der richtigen Übersetzung zu.","pairs":[["vocābor","ich werde gerufen werden"],["vocor","ich werde gerufen"],["vocābō","ich werde rufen"],["vocābar","ich wurde gerufen"]],"ok":"Alles richtig! Jetzt hast du die „werden“ im Griff.","no":"Noch nicht. Denk an den Detektor: Passiv braucht „gerufen“, Futur Passiv braucht zusätzlich noch ein „werden“."},{"choice":"Die Profi-Frage (konsonantische Konjugation): Was heißt pellētur?","lat":"pellētur","opts":[["er wird vertrieben werden",true,"Genau. -ē- zeigt das Futur der konsonantischen Konjugation, -tur das Passiv."],["er wird vertrieben",false,"Das wäre pellitur – mit -i-, Präsens."],["er wird vertreiben",false,"Das ist Futur Aktiv: pellet."],["er wurde vertrieben",false,"Das wäre pellēbātur – Imperfekt."]]},{"say":"Bobibu","de":"Na also! Aber so richtig sitzt das erst, wenn man es dort übt, wo das Passiv zu Hause ist. Kameeeeel – mach mal die Tafel auf!"},{"say":"Kameeeeel","de":"Kaaaa-meeeeel!"},{"say":"","de":"Die Beamer-Tafel flackert, knistert … und in der Mitte öffnet sich ein schwarzes Loch."}],"tafel":[{"say":"Bobibu","de":"Spring rein! Keine Sorge, das Kameeeeel passt auf Herrn Wendland auf. Wir sehen uns in Rom!"},{"say":"","de":"Du holst Luft, nimmst Anlauf – und springst mitten in die Tafel hinein …"}],"bobibu":[{"say":"Bobibu","de":"Uff, gelandet! Willkommen in Rom, 133 v. Chr., auf dem Forum Romanum. Heute ist ein unruhiger Tag: Viele Bürger haben ihre Äcker verloren – aber keiner sagt, wer sie ihnen genommen hat."},{"say":"Bobibu","de":"Das liegt am Passiv: Es sagt, was jemandem geschieht – aber nicht unbedingt, wer es tut. Du findest es heraus. Fang bei dem alten Soldaten an, dort drüben bei den Läden."}],"veteranus":[{"say":"Veteranus","lat":"Nūper prō patriā pūgnāvī et vīcī. Nunc autem ē sēdibus meīs pellor. Uxor et līberī famē urgentur.","vok":"nūper: neulich · sēdēs: Wohnsitz · pellere: vertreiben · famēs: Hunger · urgēre: bedrängen"},{"choice":"Bestimme die Form pellor.","lat":"ē sēdibus meīs pellor","opts":[["1. Person Singular Präsens Passiv",true,"Richtig. -or ist die Endung der 1. Person Singular Passiv: „ich werde vertrieben“."],["1. Person Singular Präsens Aktiv",false,"Aktiv hieße es pellō – „ich vertreibe“. Achte auf die Endung -or."],["1. Person Singular Futur Passiv",false,"Das Futur Passiv hieße pellar. Hier steht Präsens."],["3. Person Singular Präsens Passiv",false,"Die 3. Person hieße pellitur. -or gehört zur 1. Person: „ich“."]]},{"choice":"Wie übersetzt du diesen Satz?","lat":"Uxor et līberī famē urgentur.","opts":[["Frau und Kinder werden vom Hunger bedrängt.",true,"Genau. urgentur ist Passiv Präsens, famē gibt die Ursache an."],["Frau und Kinder bedrängen den Hunger.",false,"urgentur ist Passiv: Frau und Kinder tun nichts, ihnen geschieht etwas."],["Frau und Kinder werden vom Hunger bedrängt werden.",false,"Das wäre Futur: urgēbuntur. Hier steht Präsens."],["Frau und Kinder wurden vom Hunger bedrängt.",false,"Das wäre Imperfekt: urgēbantur. Hier steht Präsens."]]},{"say":"Veteranus","lat":"Ā quō pellor? Nēmō mihi dīcit!","de":"„Von wem werde ich vertrieben? Niemand sagt es mir!“ – Er zeigt zur Rostra: Auf dem Stein daneben steht eine Inschrift. Lies sie."}],"lapis":[{"say":"Inschriftstein","lat":"AGER·PVBLICVS · A·NOBILIBVS · OCCVPATVR","inschrift":true,"de":"In Normalschrift: Ager pūblicus ā nōbilibus occupātur.","vok":"ager pūblicus: das Staatsland · nōbilēs: die Adligen · occupāre: besetzen"},{"pick":"Tippe die Wörter an, die sagen, WER hier handelt.","words":["Ager","pūblicus","ā","nōbilibus","occupātur"],"right":["ā","nōbilibus"],"ok":"Richtig: ā nōbilibus – „von den Adligen“. Das ist der Ablativ des Urhebers (ablātīvus auctōris). Endlich steht da, wer es tut.","no":"Noch nicht. Gesucht ist der Handelnde. Er steht im Ablativ, meist mit ā oder ab."},{"build":"Mach aus dem Aktivsatz einen Passivsatz.","lat":"Nōbilēs agrōs occupant.","tiles":["agrī","occupant","ā","nōbilēs","occupantur","agrōs","nōbilibus","occupābuntur"]},{"choice":"Bobibu behauptet: „Im Lektionstext von Tiberius steht auch ā nōbilibus!“ Stimmt das?","opts":[["Stimmt nicht.",true,"Richtig, Bobibu irrt. Die Adligen kommen nur einmal als Handelnde vor – im Aktiv: Nōbilēs … cīvēs Rōmānōs ab agrīs pepulērunt (Z. 2). Wo es später um das Elend der Bürger geht, steht das Passiv ohne Handelnden: pūniuntur, occupantur, opprimimur …"],["Stimmt.",false,"Bobibu irrt. ā nōbilibus steht nirgends im Text. Die Adligen werden nur in Z. 2 im Aktiv genannt: Nōbilēs … pepulērunt. Später fehlt der Handelnde."]]}],"tiberius":[{"say":"Tiberius Gracchus","lat":"Appellāminī dominī terrārum, nunc autem patria sēdēsque occupantur et errātis per terrās.","vok":"Zeile 14–15 · appellāre: nennen · dominus: Herr · terra: Erde, Land · errāre: umherirren"},{"pick":"Tippe alle Passivformen in diesem Satz an.","words":["Appellāminī","dominī","terrārum","nunc","autem","patria","sēdēsque","occupantur","et","errātis","per","terrās"],"right":["Appellāminī","occupantur"],"ok":"Richtig: appellāminī („ihr werdet genannt“) und occupantur („werden besetzt“). errātis ist Aktiv: Das Umherirren tun die Bürger selbst.","no":"Noch nicht ganz. Passiv erkennst du an -minī, -ntur, -r, -tur … errātis endet auf -tis: Aktiv."},{"choice":"Tiberius fährt fort: Hodiē ā mē lēx nova rogābitur. Was stimmt?","lat":"Hodiē ā mē lēx nova rogābitur.","opts":[["rogābitur ist 3. Sg. Futur Passiv – Tiberius selbst bringt das Gesetz ein (ā mē).",true,"Genau. -bi- zeigt das Futur, -tur das Passiv. Und hier nennt Tiberius den Handelnden: sich selbst."],["rogābitur ist 3. Sg. Präsens Passiv – Tiberius bringt das Gesetz ein.",false,"Achte auf -bi-: rogābitur ist Futur („wird beantragt werden“)."],["rogābitur ist 3. Sg. Futur Passiv – die Adligen bringen das Gesetz ein.",false,"ā mē heißt „von mir“ – Tiberius spricht von sich selbst."],["rogābitur ist 3. Sg. Futur Aktiv – das Gesetz fragt.",false,"-tur ist eine Passivendung. Das Gesetz wird beantragt."]]},{"verdict":"Herren der Welt – oder Fremde im eigenen Land? Was sind die römischen Bürger?","opts":["Herren der Welt","Fremde im eigenen Land","Beides – je nachdem, wer spricht"],"text":"Schau auf das Genus verbi: dominī terrārum werden sie nur genannt (appellāminī, Passiv) – den Titel geben ihnen andere. Umherirren tun sie selbst (errātis, Aktiv). Und wer ihnen das Land nimmt, verschweigt das Passiv. Den Handelnden hast du auf dem Stein gefunden: ā nōbilibus."}],"octavius":[{"say":"Bobibu","de":"Jetzt soll das Volk über Tiberius’ Ackergesetz abstimmen: Das Staatsland (ager publicus), das die Großgrundbesitzer besetzt haben, soll neu aufgeteilt und an arme Bürger vergeben werden. Aber Moment – da steht noch jemand auf der Rostra. Das ist Marcus Octavius, auch ein Volkstribun. Und er sieht gar nicht glücklich aus."},{"say":"Marcus Octavius","lat":"Vetō!","de":"„Ich verbiete es!“ Als Volkstribun lege ich Einspruch gegen dieses Ackergesetz ein. Darüber wird nicht abgestimmt."},{"say":"Bobibu","de":"Das durfte er: Jeder Volkstribun konnte mit einem einzigen Wort – vetō – ein Gesetz stoppen. Jetzt steckt Tiberius fest."},{"say":"Tiberius Gracchus","de":"Bürger! Ein Volkstribun, der gegen das Volk arbeitet, ist kein Volkstribun mehr. Stimmt ab: Soll Octavius sein Amt verlieren?"},{"say":"","de":"Die Menge stimmt ab."},{"say":"Bobibu","de":"Octavius ist abgewählt. Er muss die Rostra verlassen. Der Weg für das Ackergesetz ist frei – aber zu welchem Preis?"},{"choice":"Was sagt die Sachinfo zu dem, was Tiberius gerade getan hat?","opts":[["Einen anderen Volkstribunen abwählen zu lassen, war eindeutig ungesetzlich.",true,"Genau so steht es in der Sachinfo: „Das war eindeutig ungesetzlich.“ Nur so konnte Tiberius sein Gesetz durchsetzen."],["Es war erlaubt, weil das Volk abgestimmt hat.",false,"So sieht es Tiberius. Die Sachinfo nennt es aber eindeutig ungesetzlich."],["Das war ein ganz normaler Vorgang in der Republik.",false,"Nein – im Abschnitt „Gesetzesbruch und Gewalt“ steht das Gegenteil."]]},{"choice":"Warum kann das für Tiberius noch gefährlich werden?","opts":[["Seine Gegner können ihm jetzt Gesetzesbruch vorwerfen.",true,"Richtig. Die Sachinfo sagt: Formal waren die Gegner im Recht, weil sie den Popularen Gesetzesbruch vorwerfen konnten."],["Weil Octavius jetzt zu den Popularen wechselt.",false,"Davon steht nichts in der Sachinfo. Lies noch einmal den letzten Abschnitt."],["Weil das Volk ihn jetzt nicht mehr unterstützt.",false,"Das Volk jubelt ihm eher zu. Gefährlich werden ihm seine Gegner."]]}],"streit":[{"say":"Bobibu","de":"Tiberius’ Ackergesetz ist beschlossen! Das Staatsland, das die Großgrundbesitzer besetzt hatten, wird neu aufgeteilt. Drei Männer sollen das erledigen – eine Ackerkommission. Einer davon ist Tiberius’ jüngerer Bruder Gaius. Hör mal – da drüben wird gestritten."},{"say":"Ein Optimat","de":"Wir Adligen sind die Besten, optimī! Wir wissen, was gut für Rom ist. Diese Reform schwächt unsere Stellung. Das Land bewirtschaften wir seit vielen Jahren!"},{"say":"Gaius Gracchus","de":"Das Land gehört dem Staat, nicht euch! Die Bauern haben für Rom gekämpft – und jetzt haben sie keinen Hof mehr. Wir stehen auf der Seite des Volkes."},{"lager":"Wer würde so etwas sagen? Ordne jede Aussage zu.","kats":["Optimaten","Popularen"],"items":[["„Die Forderungen der Kleinbauern sind berechtigt.“","Popularen"],["„Der Adel ist den anderen überlegen.“","Optimaten"],["„Das Staatsland muss neu aufgeteilt werden.“","Popularen"],["„Diese Reform schwächt unsere Stellung.“","Optimaten"],["„Wir stehen dem Volk näher.“","Popularen"],["„Tiberius hat das Gesetz gebrochen!“","Optimaten"]],"ok":"Alles richtig zugeordnet. Die Namen verraten es schon: populus – das Volk; optimus – der Beste.","no":"Denk an die Namen: Popularen von populus (Volk), Optimaten von optimus (der Beste)."},{"choice":"Was haben Optimaten und Popularen gemeinsam?","opts":[["Beide sind Adlige – sie sind sich nur nicht einig, wie sie auf die Forderungen reagieren sollen.",true,"Genau. Die Sachinfo sagt: „Die Adligen waren sich nicht einig, wie sie darauf reagieren sollten.“"],["Beide sind verarmte Bauern.",false,"Nein – um die Bauern wird gestritten. Streiten tun
